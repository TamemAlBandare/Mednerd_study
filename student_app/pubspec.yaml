name: MedNerd
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_pdfview: ^1.3.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  device_info_plus: ^13.2.0
  google_fonts: ^6.2.1
  video_player: ^2.8.2
  path_provider: ^2.1.2
  http: ^1.2.0
  flutter_windowmanager_plus: ^1.0.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0
  android_id: ^0.4.0
  cryptography: ^2.7.0
  youtube_player_iframe: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo2.jpg" # مسار شعارك الحالي في المشروع

flutter:
  uses-material-design: true

  assets:
    - assets/images/
